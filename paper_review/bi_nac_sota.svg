<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B616B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="66" font-size="38" font-weight="700" fill="#1F2328">Where Bi-NAC sits relative to the state of the art</text>

  <!-- ===== Lineage 1: RLVR ===== -->
  <rect x="60" y="110" width="840" height="160" rx="14" fill="#F7FAFF" stroke="#2F6FEB" stroke-width="2"/>
  <circle cx="98" cy="148" r="18" fill="#2F6FEB"/><text x="98" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
  <text x="128" y="157" font-size="26" font-weight="700" fill="#1A4FB8">RL with verifiable rewards</text>
  <text x="128" y="188" font-size="19" fill="#5B616B" font-style="italic">GRPO · DeepSeek-R1 · Dr. GRPO</text>
  <text x="128" y="222" font-size="20" fill="#1F2328"><tspan font-weight="700" fill="#2E8B47">Gives: </tspan>simple, scalable RL from a correctness check</text>
  <text x="128" y="252" font-size="20" fill="#1F2328"><tspan font-weight="700" fill="#C0392B">Gap: </tspan>binary end-of-answer reward → advantage collapse</text>

  <!-- ===== Lineage 2: Critique-guided RL ===== -->
  <rect x="60" y="288" width="840" height="160" rx="14" fill="#FFFAF3" stroke="#E07B00" stroke-width="2"/>
  <circle cx="98" cy="326" r="18" fill="#E07B00"/><text x="98" y="333" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
  <text x="128" y="335" font-size="26" font-weight="700" fill="#A85A00">Critique-guided RL &amp; generative reward models</text>
  <text x="128" y="366" font-size="19" fill="#5B616B" font-style="italic">Critique-GRPO · process supervision · generative RMs · synthetic critiques</text>
  <text x="128" y="400" font-size="20" fill="#1F2328"><tspan font-weight="700" fill="#2E8B47">Gives: </tspan>denser signal from natural-language critiques</text>
  <text x="128" y="430" font-size="20" fill="#1F2328"><tspan font-weight="700" fill="#C0392B">Gap: </tspan>critic frozen or trained apart from the actor → correct, not actionable</text>

  <!-- ===== Lineage 3: Self-correction ===== -->
  <rect x="60" y="466" width="840" height="160" rx="14" fill="#FAF6FE" stroke="#7B4FD6" stroke-width="2"/>
  <circle cx="98" cy="504" r="18" fill="#7B4FD6"/><text x="98" y="511" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
  <text x="128" y="513" font-size="26" font-weight="700" fill="#5A35A8">Multi-turn self-correction</text>
  <text x="128" y="544" font-size="19" fill="#5B616B" font-style="italic">Reflexion · Self-Refine · ReAct · SCoRe · ArCHer</text>
  <text x="128" y="578" font-size="20" fill="#1F2328"><tspan font-weight="700" fill="#2E8B47">Gives: </tspan>attempt → revise loop; RL-trained actor that revises</text>
  <text x="128" y="608" font-size="20" fill="#1F2328"><tspan font-weight="700" fill="#C0392B">Gap: </tspan>feedback generic or untrained; only the actor learns</text>

  <!-- ===== Lineage 4: Bilevel ===== -->
  <rect x="60" y="644" width="840" height="160" rx="14" fill="#F4FAF5" stroke="#2E8B47" stroke-width="2"/>
  <circle cx="98" cy="682" r="18" fill="#2E8B47"/><text x="98" y="689" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">4</text>
  <text x="128" y="691" font-size="26" font-weight="700" fill="#1E6B34">Bilevel optimization &amp; meta-learning</text>
  <text x="128" y="722" font-size="19" fill="#5B616B" font-style="italic">MAML · bilevel hyperparameter tuning · bilevel intrinsic-reward learning</text>
  <text x="128" y="756" font-size="20" fill="#1F2328"><tspan font-weight="700" fill="#2E8B47">Gives: </tspan>optimize one learner through another’s learning</text>
  <text x="128" y="786" font-size="20" fill="#1F2328"><tspan font-weight="700" fill="#C0392B">Gap: </tspan>learns scalar rewards or hyperparameters, never a language critic</text>

  <!-- ===== Arrows ===== -->
  <path d="M902,190 C980,190 990,314 1062,314" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M902,368 C980,368 990,404 1062,404" fill="none" stroke="#E07B00" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M902,546 C980,546 990,484 1062,484" fill="none" stroke="#7B4FD6" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M902,724 C980,724 990,574 1062,574" fill="none" stroke="#2E8B47" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ===== Bi-NAC ===== -->
  <rect x="1066" y="170" width="480" height="560" rx="16" fill="#1F2328"/>
  <text x="1096" y="222" font-size="32" font-weight="700" fill="#FFFFFF">Bi-NAC</text>
  <text x="1096" y="252" font-size="18" fill="#A9B0BA">Singh et al., ICML 2026</text>
  <text x="1096" y="290" font-size="17" font-weight="700" fill="#A9B0BA" letter-spacing="1.5">TAKES FROM EACH</text>

  <circle cx="1108" cy="300" r="0" fill="none"/>
  <circle cx="1108" cy="314" r="11" fill="#2F6FEB"/><text x="1108" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="1130" y="321" font-size="20" fill="#FFFFFF">Verifiable reward, policy gradient</text>
  <circle cx="1108" cy="404" r="11" fill="#E07B00"/><text x="1108" y="409" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="1130" y="397" font-size="20" fill="#FFFFFF">An LLM critic writing feedback</text>
  <text x="1130" y="421" font-size="20" fill="#FFFFFF">into the actor’s context</text>
  <circle cx="1108" cy="484" r="11" fill="#7B4FD6"/><text x="1108" y="489" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="1130" y="491" font-size="20" fill="#FFFFFF">Two-turn attempt → revise</text>
  <circle cx="1108" cy="574" r="11" fill="#2E8B47"/><text x="1108" y="579" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="1130" y="567" font-size="20" fill="#FFFFFF">Stackelberg bilevel objective</text>
  <text x="1130" y="591" font-size="20" fill="#FFFFFF">(critic leads, actor follows)</text>

  <line x1="1096" y1="620" x2="1516" y2="620" stroke="#4A5058" stroke-width="2"/>
  <text x="1096" y="652" font-size="17" font-weight="700" fill="#F2B84B" letter-spacing="1.5">WHAT IS NEW</text>
  <text x="1096" y="682" font-size="20" fill="#FFFFFF">Critic and actor trained jointly; the critic</text>
  <text x="1096" y="708" font-size="20" fill="#FFFFFF">is rewarded by the actor’s gain after adapting</text>

  <text x="60" y="862" font-size="17" fill="#8A9099">Lineages and examples from the paper’s related-work section (Appendix A.1). Advantage collapse: 74% of GRPO groups on MBPP get zero advantage.</text>
</svg>
