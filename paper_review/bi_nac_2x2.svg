<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="80" y="70" font-size="38" font-weight="700" fill="#1F2328">Where Bi-NAC sits: which model is trained, and are they coupled?</text>

  <!-- Y axis -->
  <text transform="translate(120,460) rotate(-90)" text-anchor="middle" font-size="24" font-weight="600" fill="#1F2328">Critic (feedback generator) RL-trained?</text>
  <text x="235" y="303" text-anchor="end" font-size="24" font-weight="600" fill="#5B616B">Yes</text>
  <text x="235" y="633" text-anchor="end" font-size="24" font-weight="600" fill="#5B616B">No</text>

  <!-- X axis -->
  <text x="570" y="822" text-anchor="middle" font-size="24" font-weight="600" fill="#5B616B">No</text>
  <text x="1190" y="822" text-anchor="middle" font-size="24" font-weight="600" fill="#5B616B">Yes</text>
  <text x="880" y="862" text-anchor="middle" font-size="24" font-weight="600" fill="#1F2328">Actor (solver) RL-trained?</text>

  <!-- Top-left: Hier-FT -->
  <rect x="260" y="140" width="610" height="310" rx="14" fill="#F5F5F3" stroke="#D6D6D2" stroke-width="2"/>
  <text x="290" y="195" font-size="34" font-weight="700" fill="#1F2328">Hier-FT</text>
  <text x="290" y="240" font-size="22" fill="#1F2328">RL-trained critic, frozen pretrained actor</text>
  <text x="290" y="272" font-size="22" fill="#5B616B">Better feedback, but the actor never</text>
  <text x="290" y="300" font-size="22" fill="#5B616B">learns to use it</text>
  <text x="290" y="410" font-size="26" font-weight="600" fill="#1F2328">Acc 38.0%  ·  FO 3.0</text>

  <!-- Top-right: Bi-NAC -->
  <rect x="890" y="140" width="610" height="310" rx="14" fill="#E9F1FE" stroke="#2F6FEB" stroke-width="4"/>
  <text x="920" y="195" font-size="34" font-weight="700" fill="#1A4FB8">Bi-NAC  (both trained, coupled)</text>
  <text x="920" y="240" font-size="22" fill="#1F2328">Critic optimized for the actor’s reward after it</text>
  <text x="920" y="268" font-size="22" fill="#1F2328">adapts: a Stackelberg bilevel objective</text>
  <text x="920" y="330" font-size="26" font-weight="700" fill="#1A4FB8">Acc 46.6%  ·  FO 4.2</text>
  <line x1="920" y1="356" x2="1470" y2="356" stroke="#B9CDF5" stroke-width="2"/>
  <text x="920" y="392" font-size="20" fill="#5B616B">Ablation, both trained but not coupled</text>
  <text x="920" y="420" font-size="20" fill="#5B616B">(Bi-NAC w/o bilevel term): Acc 41.8% · FO 3.6</text>

  <!-- Bottom-left: Hier-NFT -->
  <rect x="260" y="470" width="610" height="310" rx="14" fill="#F5F5F3" stroke="#D6D6D2" stroke-width="2"/>
  <text x="290" y="525" font-size="34" font-weight="700" fill="#1F2328">Hier-NFT</text>
  <text x="290" y="570" font-size="22" fill="#1F2328">Pretrained actor + pretrained critic (zero-shot)</text>
  <text x="290" y="602" font-size="22" fill="#5B616B">Feedback not optimized for any reward</text>
  <text x="290" y="740" font-size="26" font-weight="600" fill="#1F2328">Acc 35.4%  ·  FO 2.1</text>

  <!-- Bottom-right: SCoRe -->
  <rect x="890" y="470" width="610" height="310" rx="14" fill="#F5F5F3" stroke="#D6D6D2" stroke-width="2"/>
  <text x="920" y="525" font-size="34" font-weight="700" fill="#1F2328">SCoRe</text>
  <text x="920" y="570" font-size="22" fill="#1F2328">RL-trained actor, fixed generic feedback</text>
  <text x="920" y="602" font-size="22" fill="#5B616B">(“Please think carefully…”)</text>
  <text x="920" y="650" font-size="20" fill="#5B616B">Also here: ArCHer (no critic), Critique-GRPO,</text>
  <text x="920" y="676" font-size="20" fill="#5B616B">Dr. GRPO (auxiliary, untrained critic)</text>
  <text x="920" y="740" font-size="26" font-weight="600" fill="#1F2328">Acc 39.6%  ·  FO 2.1</text>

  <!-- Footnote -->
  <text x="80" y="890" font-size="17" fill="#8A9099">MATH-500, LLaMA-3.2-1B. FO = Feedback Actionability (1–5, LLM judge). Source: Singh et al., ICML 2026, Table 4.</text>
</svg>
